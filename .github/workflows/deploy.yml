# Выкладка на свой сервер после каждого изменения в main.
# Образ собирается здесь, на GitHub, и уходит на сервер по SSH: на сервере ничего не собирается,
# пароли от реестров не нужны. Открытые настройки: deploy/site.env, секреты: deploy/README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройки
        id: cfg
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          grep -E '^[A-Z_]+=' deploy/site.env >> "$GITHUB_ENV"
          echo "HOST=$(grep '^DEPLOY_HOST=' deploy/site.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          if [ -z "$SSH_KEY" ] || [ -z "$GEMINI" ]; then
            echo "::notice::Выкладка пропущена: в GitHub ещё нет секретов DEPLOY_SSH_KEY и GEMINI_API_KEY (см. deploy/README.md)."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Подготовить SSH
        if: steps.cfg.outputs.ready == 'yes'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null || { echo "::error::Секрет DEPLOY_SSH_KEY не похож на ключ: вставьте весь файл opora_deploy, от -----BEGIN до -----END"; exit 1; }
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts; fi
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' "$HOST" > ~/.ssh/config

      - name: Собрать образ
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          # «server» в site.env: открытый ключ своей базы берётся с сервера (он создаётся там при первой выкладке)
          if [ "$NEXT_PUBLIC_SUPABASE_ANON_KEY" = "server" ]; then
            K=$(ssh prod "grep '^SB_ANON_KEY=' /opt/opora/server.env | cut -d= -f2-")
            [ -n "$K" ] || { echo "::error::На сервере ещё нет ключа своей базы: сначала выложите сайт с облачными настройками"; exit 1; }
            NEXT_PUBLIC_SUPABASE_ANON_KEY="$K"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$K" >> "$GITHUB_ENV"
          fi
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            -t opora:${{ github.sha }} .

      - name: Отправить образ и настройки на сервер
        if: steps.cfg.outputs.ready == 'yes'
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          docker save opora:${{ github.sha }} | gzip -1 | ssh prod 'gunzip | docker load'
          ssh prod 'mkdir -p /opt/opora/supabase/templates'
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/dc.sh deploy/migrate.sh prod:/opt/opora/
          ssh prod 'rm -rf /opt/opora/migrations && mkdir -p /opt/opora/migrations'
          scp supabase/migrations/*.sql prod:/opt/opora/migrations/
          scp deploy/supabase/roles.sql deploy/supabase/jwt.sql deploy/supabase/gen-keys.sh prod:/opt/opora/supabase/
          scp supabase/templates/*.html prod:/opt/opora/supabase/templates/
          # .env собирается из открытых настроек и секретов GitHub при каждой выкладке.
          # server.env создаётся на сервере один раз (CRON_SECRET, ключи базы) и его не покидает.
          {
            grep -E '^[A-Z_]+=' deploy/site.env | grep -v '^NEXT_PUBLIC_SUPABASE_ANON_KEY='
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "DOMAIN=${NEXT_PUBLIC_SITE_URL#https://}"
            echo "GEMINI_API_KEY=$GEMINI"
            if [ -n "$RESEND" ]; then echo "RESEND_API_KEY=$RESEND"; echo "SMTP_PASS=$RESEND"; fi
            if [ -n "$CLOUDFLARE" ]; then echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE"; fi
            if [ -n "$PROD_ENV" ]; then printf '%s\n' "$PROD_ENV" | tr -d '\r'; fi
          } | ssh prod 'umask 077 && cat > /opt/opora/.env'
          ssh prod 'set -e; cd /opt/opora; chmod +x dc.sh migrate.sh supabase/gen-keys.sh
            test -f server.env || (umask 077 && echo "CRON_SECRET=$(openssl rand -hex 32)" > server.env)
            bash supabase/gen-keys.sh server.env'
          # Постоянная пара VAPID хранится только на сервере, чтобы подписки переживали выкладки.
          ssh prod 'set -e; cd /opt/opora
            if ! grep -q "^WEB_PUSH_PUBLIC_KEY=" server.env && ! grep -q "^WEB_PUSH_PRIVATE_KEY=" server.env; then
              keys=$(docker run --rm --entrypoint node opora:${{ github.sha }} -e "const ecdh = require(\"node:crypto\").createECDH(\"prime256v1\"); ecdh.generateKeys(); const privateKey = Buffer.from(ecdh.getPrivateKey().toString(\"hex\").padStart(64, \"0\"), \"hex\"); console.log(\"WEB_PUSH_PUBLIC_KEY=\" + ecdh.getPublicKey().toString(\"base64url\")); console.log(\"WEB_PUSH_PRIVATE_KEY=\" + privateKey.toString(\"base64url\"));")
              printf "\n%s\n" "$keys" >> server.env
            fi'

      - name: Перезапустить сайт
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          ssh prod "set -e
            cd /opt/opora
            # Пока сайт смотрит в свою базу, ему нужен её ключ администратора
            if grep -q '^NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SITE_URL\$' .env; then
              echo \"APP_SERVICE_ROLE_KEY=\$(grep '^SB_SERVICE_ROLE_KEY=' server.env | cut -d= -f2-)\" >> .env
            fi
            # Новые изменения базы (supabase/migrations) — до запуска нового сайта
            ./dc.sh up -d --wait db
            ./migrate.sh
            # Порты голоса «Комнат» (LiveKit); повторный запуск ничего не меняет
            sudo ufw allow 7881/tcp >/dev/null && sudo ufw allow 7882/udp >/dev/null || echo 'Не удалось открыть порты голоса 7881/tcp и 7882/udp'
            docker tag opora:${{ github.sha }} opora:latest
            OPORA_TAG=${{ github.sha }} ./dc.sh up -d --remove-orphans
            # Caddy сам не замечает новый Caddyfile: без этого новые адреса (например /rtc для голоса «Комнат») не работают
            ./dc.sh exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || ./dc.sh restart caddy
            docker images opora --format '{{.Tag}}' | grep -v '^latest$' | tail -n +4 | xargs -r -I{} docker rmi opora:{} >/dev/null || true
            docker image prune -f >/dev/null"

      - name: Проверить, что сайт открывается
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$NEXT_PUBLIC_SITE_URL/welcome"; then echo "Сайт работает: $NEXT_PUBLIC_SITE_URL"; exit 0; fi
            sleep 6
          done
          echo "::warning::Сайт не открылся по адресу $NEXT_PUBLIC_SITE_URL за 3 минуты (если DNS домена ещё не указывает на сервер, это ожидаемо)"
          ssh prod 'cd /opt/opora && ./dc.sh ps && ./dc.sh logs --tail 60 app caddy auth'
          exit 1
