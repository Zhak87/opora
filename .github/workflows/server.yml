# Обслуживание сервера без входа на него руками: запускается вручную (Actions → Server → Run workflow).
#   setup   — первая настройка чистого сервера (входит как root по тому же ключу, потом root закрывается)
#   status  — что запущено, память, диск, срок SSL
#   logs    — последние строки журналов сайта и Caddy
#   mail    — почему не приходят письма входа: ошибки службы входа, домен в Resend, DNS (ничего не меняет)
#   voice   — проверка голоса «Комнат»: медиасервер LiveKit, его журнал и порты (ничего не меняет)
#   reload-caddy — перечитать Caddyfile без остановки сайта (если новые адреса не заработали после выкладки)
#   restart — перезапустить сайт
#   migrate-db — перенести данные и аккаунты из облачного Supabase в свою базу (нужен секрет SUPABASE_DB_URL)
#   anon-key — показать публичный ключ своей базы (он не секретный, его видит каждый браузер)
name: Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: Что сделать
        type: choice
        options: [status, logs, mail, voice, reload-caddy, restart, setup, migrate-db, anon-key]
        default: status

concurrency:
  group: production-server
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройки
        run: |
          grep -E '^[A-Z_]+=' deploy/site.env >> "$GITHUB_ENV"
          echo "HOST=$(grep '^DEPLOY_HOST=' deploy/site.env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Подготовить SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "Добавьте секрет DEPLOY_SSH_KEY (см. deploy/README.md)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null || { echo "::error::Секрет DEPLOY_SSH_KEY не похож на ключ: вставьте весь файл opora_deploy, от -----BEGIN до -----END"; exit 1; }
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts; fi
          echo "Отпечаток ключа сервера (сверьте с панелью хостинга, если она его показывает):"
          ssh-keygen -lf ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\nHost prod-root\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' "$HOST" "$HOST" > ~/.ssh/config

      - name: setup
        if: inputs.action == 'setup'
        env:
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          PUB=$(ssh-keygen -y -f ~/.ssh/id_deploy)
          if ssh -o BatchMode=yes -o ConnectTimeout=15 prod true 2>/dev/null; then
            # Пользователь deploy уже есть (повторный запуск): настраиваем через sudo
            T=prod; RUN="sudo bash"
          else
            T=prod-root; RUN=bash
            # Если хостинг выдал только пароль root: он лежит в секрете ROOT_PASSWORD, по нему один раз
            # кладётся ключ, дальше вход по паролю выключается. Секрет после этого можно удалить.
            if [ -n "$ROOT_PASSWORD" ]; then
              sudo apt-get -qq install -y sshpass >/dev/null
              echo "$PUB" | SSHPASS="$ROOT_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no "root@$HOST" \
                'install -d -m 700 /root/.ssh && cat >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys'
            fi
          fi
          scp deploy/server-setup.sh $T:/tmp/server-setup.sh
          ssh $T "$RUN /tmp/server-setup.sh '$PUB'"
          ssh prod 'docker --version && echo "Вход deploy по ключу работает"'

      - name: status
        if: inputs.action == 'status'
        run: |
          ssh prod 'uptime; echo; free -h; echo; df -h /; echo; cd /opt/opora 2>/dev/null && ./dc.sh ps || echo "Сайт ещё не выложен"; echo; echo "Резервные копии:"; ls -lh /opt/opora/backups 2>/dev/null | tail -6; echo; echo "Сайт видит свою базу:"; ./dc.sh exec -T app wget -qO- -T 10 https://$(grep ^DOMAIN= .env | cut -d= -f2)/auth/v1/health || echo "НЕТ: приложение не достучалось до своей базы по адресу сайта"'
          if [ -n "$NEXT_PUBLIC_SITE_URL" ]; then
            D=$(echo "$NEXT_PUBLIC_SITE_URL" | sed -E 's#https?://##; s#/.*##')
            echo; echo "DNS для $D:"; getent hosts "$D" || echo "домен ещё не виден в интернете"
            echo; echo "SSL для $D:"; echo | openssl s_client -connect "$D:443" -servername "$D" 2>/dev/null | openssl x509 -noout -issuer -enddate || echo "SSL пока нет"
          fi

      - name: logs
        if: inputs.action == 'logs'
        run: ssh prod 'cd /opt/opora && ./dc.sh logs --tail 150 app caddy cron auth rest storage backup'

      - name: mail
        if: inputs.action == 'mail'
        env:
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          D=${NEXT_PUBLIC_SITE_URL#https://}
          echo "== Настройки почты в службе входа (без пароля)"
          ssh prod 'cd /opt/opora && ./dc.sh exec -T auth sh -c "env | grep -E \"^GOTRUE_(SMTP_(HOST|PORT|USER|ADMIN_EMAIL|SENDER_NAME)|MAILER_AUTOCONFIRM|RATE_LIMIT_EMAIL_SENT|SITE_URL)=\"; printenv GOTRUE_SMTP_PASS | wc -c"' || true
          echo; echo "== Ошибки и письма в журнале входа за 3 дня"
          ssh prod 'cd /opt/opora && ./dc.sh logs --since 72h auth 2>&1 | grep -v GOTRUE_MAILER_EXTERNAL_HOSTS | grep -iE "mail|smtp|error|rate.?limit|signup|recover|over_" | sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/***@***/g" | tail -60' || true
          echo; echo "== Все запросы, после которых уходит письмо (регистрация, повтор, новый пароль, смена почты), за 3 дня"
          ssh prod 'cd /opt/opora && ./dc.sh logs --no-log-prefix --since 72h auth 2>&1' | jq -R -r 'fromjson? | select(.msg=="request completed" and ((.path // "")|test("^/(signup|recover|resend|otp|magiclink|user)$")) and (.method=="POST" or .method=="PUT")) | [.time, .method, .path, .status, ((.duration/1000000|floor|tostring)+"ms"), (.auth_event.action // ""), (.error // ""), (.referer // "")] | @tsv' || true
          echo; echo "== Ошибки отправки писем за 7 дней"
          ssh prod 'cd /opt/opora && ./dc.sh logs --since 168h auth 2>&1 | grep -iE "smtp|sending|mailer|email_send|over_email|535|554|550" | grep -v GOTRUE_MAILER_EXTERNAL_HOSTS | sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/***@***/g" | tail -30' || true
          echo; echo "== Аккаунты за 4 дня (почтовый домен, когда отправлены письма)"
          cat > /tmp/q.sql <<'SQL'
          select to_char(created_at,'MM-DD HH24:MI') created, is_anonymous anon, split_part(email,'@',2) dom,
            to_char(confirmation_sent_at,'MM-DD HH24:MI') conf_sent, to_char(email_confirmed_at,'MM-DD HH24:MI') confirmed,
            split_part(email_change,'@',2) change_to, to_char(email_change_sent_at,'MM-DD HH24:MI') change_sent,
            to_char(recovery_sent_at,'MM-DD HH24:MI') recovery_sent, to_char(last_sign_in_at,'MM-DD HH24:MI') last_in
          from auth.users
          where created_at > now() - interval '4 days' or recovery_sent_at > now() - interval '4 days'
             or email_change_sent_at > now() - interval '4 days' or confirmation_sent_at > now() - interval '4 days'
          order by created_at;
          SQL
          ssh prod 'cd /opt/opora && ./dc.sh exec -T db psql -U postgres' < /tmp/q.sql || true
          echo; echo "== Ошибки сайта за 2 дня"
          ssh prod 'cd /opt/opora && ./dc.sh logs --since 48h app 2>&1 | grep -iE "error|fail|auth" | sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/***@***/g" | tail -40' || true
          echo; echo "== Регистрации за 4 дня по дням"
          ssh prod 'cd /opt/opora && ./dc.sh exec -T db psql -U postgres -c "select date(created_at) d, count(*) all_users, count(*) filter (where is_anonymous) guests, count(email_confirmed_at) confirmed, count(confirmation_sent_at) conf_sent, count(recovery_sent_at) recovery_sent from auth.users where created_at > now() - interval '"'"'4 days'"'"' group by 1 order by 1"' || true
          echo; echo "== Домен в Resend"
          if [ -n "$RESEND" ]; then
            curl -s -m 15 -H "Authorization: Bearer $RESEND" https://api.resend.com/domains > /tmp/domains.json || true
            head -c 1500 /tmp/domains.json; echo
            ID=$(python3 -c 'import sys,json; d=json.load(open("/tmp/domains.json")).get("data",[]); print(next((x["id"] for x in d if x.get("name")==sys.argv[1]),""))' "$D" || true)
            if [ -n "$ID" ]; then
              curl -s -m 15 -H "Authorization: Bearer $RESEND" "https://api.resend.com/domains/$ID" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("status:", d.get("status")); [print(r.get("record"), r.get("type"), r.get("name"), r.get("status"), str(r.get("value"))[:90]) for r in d.get("records",[])]' || true
            fi
          else echo "Нет секрета RESEND_API_KEY"; fi
          echo; echo "== DNS"
          for q in "TXT $D" "MX $D" "TXT send.$D" "MX send.$D" "TXT resend._domainkey.$D" "TXT _dmarc.$D"; do echo "-- $q:"; dig +short $q; done
          echo; echo "== Сервер достаёт до smtp.resend.com:465"
          ssh prod 'timeout 10 bash -c "exec 3<>/dev/tcp/smtp.resend.com/465" && echo открыт || echo ЗАКРЫТ'

      - name: voice
        if: inputs.action == 'voice'
        run: |
          ssh prod 'cd /opt/opora
            echo "== Служба"; ./dc.sh ps livekit caddy app
            echo; echo "== Журнал LiveKit"; ./dc.sh logs --tail 120 livekit 2>&1 | sed -E "s/(secret|token|key)[=:][^ ,}]+/\\1=***/Ig"
            echo; echo "== Ключи заданы (число строк, без значений)"; grep -c "^LIVEKIT_API_" server.env || true
            ./dc.sh exec -T app sh -c "env | grep -E \"^LIVEKIT_(URL|API_URL)=\"; env | grep -c \"^LIVEKIT_API_KEY=\"" || true
            echo; echo "== Сайт видит LiveKit"; ./dc.sh exec -T app wget -qO- -T 5 http://livekit:7880/ || echo "НЕТ"
            echo; echo "== Порты слушаются"; ss -lntu | grep -E ":(7880|7881|7882) " || echo "порты 7881/7882 не слушаются"
            echo; echo "== Брандмауэр"; sudo -n ufw status 2>/dev/null | grep -E "Status|788" || echo "ufw: нет доступа или правил нет"
            echo; echo "== Caddy: обращения к /rtc"; ./dc.sh logs --tail 400 caddy 2>&1 | grep -i "rtc" | tail -15 || true
            echo; echo "== Сайт: ошибки голоса"; ./dc.sh logs --tail 400 app 2>&1 | grep -iE "voice|livekit" | tail -15 || true'
          echo; echo "== Снаружи: служебный адрес (ждём 401 или 200, не 404/502)"
          curl -s -o /dev/null -w "%{http_code}\n" -m 10 "$NEXT_PUBLIC_SITE_URL/rtc/validate" || true
          echo "== Снаружи: порт 7881/tcp"
          timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/7881" && echo "открыт" || echo "ЗАКРЫТ снаружи"

      - name: reload-caddy
        if: inputs.action == 'reload-caddy'
        run: |
          ssh prod 'cd /opt/opora && ./dc.sh exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile'
          sleep 3
          echo "Служебный адрес голоса (ждём не 307 и не 404):"
          curl -s -o /dev/null -w "%{http_code}\n" -m 10 "$NEXT_PUBLIC_SITE_URL/rtc/validate" || true
          echo "Сайт:"
          curl -s -o /dev/null -w "%{http_code}\n" -m 10 "$NEXT_PUBLIC_SITE_URL/welcome" || true

      - name: restart
        if: inputs.action == 'restart'
        run: ssh prod 'cd /opt/opora && ./dc.sh restart app && ./dc.sh ps'

      - name: anon-key
        if: inputs.action == 'anon-key'
        run: ssh prod 'grep "^SB_ANON_KEY=" /opt/opora/server.env'

      - name: migrate-db
        if: inputs.action == 'migrate-db'
        env:
          SRC: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SRC" || { echo "::error::Добавьте секрет SUPABASE_DB_URL (строка подключения к облачной базе)"; exit 1; }
          sudo apt-get -qq install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get -qq install -y postgresql-client-17 >/dev/null
          PGD=/usr/lib/postgresql/17/bin
          mkdir -p dump && cd dump
          # 1. Схема своих таблиц, функций, правил доступа (RLS) и прав
          $PGD/pg_dump "$SRC" --schema-only --schema=public --no-owner \
            | sed '/^CREATE SCHEMA public;$/d; /^COMMENT ON SCHEMA public IS/d; /^ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin /d' > schema.sql
          # 2. То, что живёт в служебных схемах: триггеры на auth.users и правила доступа к файлам
          $PGD/psql "$SRC" -At -f ../deploy/supabase/extras.sql > extras.sql
          # 3. Данные: аккаунты (с хешами паролей), корзины файлов, все свои таблицы
          $PGD/pg_dump "$SRC" --data-only --disable-triggers -t auth.users -t auth.identities -t storage.buckets > data-auth.sql
          $PGD/pg_dump "$SRC" --data-only --disable-triggers --schema=public > data-public.sql
          wc -c *.sql
          run() { ssh prod "cd /opt/opora && ./dc.sh exec -T db psql -v ON_ERROR_STOP=1 -q -1 -U $1 -d postgres"; }
          if ssh prod 'cd /opt/opora && ./dc.sh exec -T db psql -U postgres -tAc "select count(*) from auth.users"' | grep -qx 0; then
            echo "create extension if not exists btree_gist with schema extensions;" | run supabase_admin
            run postgres < schema.sql
            run supabase_admin < data-auth.sql
            run supabase_admin < data-public.sql
            run supabase_admin < extras.sql
          else
            # Повторный запуск: база уже перенесена, затирать её не будем, докопируем только файлы и ссылки
            echo "::notice::В своей базе уже есть аккаунты: данные не трогаю, переношу только файлы"
          fi
          # 4. Файлы из открытых корзин (фото психологов): скачиваются по открытой ссылке и загружаются в свою базу
          for i in $(seq 1 20); do
            ssh prod 'cd /opt/opora && ./dc.sh exec -T storage wget -qO- http://127.0.0.1:5000/status' >/dev/null 2>&1 && break
            [ $i = 20 ] && { echo "::error::Служба файлов не отвечает"; ssh prod 'cd /opt/opora && ./dc.sh ps storage && ./dc.sh logs --tail 40 storage'; exit 1; }
            sleep 3
          done
          $PGD/psql "$SRC" -At -F '|' -c "select o.bucket_id, o.name, coalesce(o.metadata->>'mimetype','application/octet-stream'), b.public from storage.objects o join storage.buckets b on b.id = o.bucket_id" > objects.txt
          while IFS='|' read -r bucket name mime public; do
            [ -n "$bucket" ] || continue
            if [ "$public" != "t" ]; then echo "::warning::Закрытый файл $bucket/$name не перенесён (нужен ключ облака)"; continue; fi
            curl -fsS -o obj.bin "$OLD_URL/storage/v1/object/public/$bucket/$name"
            scp -q obj.bin prod:/tmp/obj.bin
            ssh prod "cd /opt/opora && ./dc.sh cp /tmp/obj.bin storage:/tmp/obj.bin && K=\$(grep '^SB_SERVICE_ROLE_KEY=' server.env | cut -d= -f2-) && ./dc.sh exec -T storage wget -qO- --header \"Authorization: Bearer \$K\" --header 'Content-Type: $mime' --header 'x-upsert: true' --post-file /tmp/obj.bin 'http://127.0.0.1:5000/object/$bucket/$name' && rm -f /tmp/obj.bin"
            echo "файл перенесён: $bucket/$name"
          done < objects.txt
          # 5. Ссылки на файлы в облаке → на свой домен
          ssh prod "cd /opt/opora && ./dc.sh exec -T db psql -v ON_ERROR_STOP=1 -q -U supabase_admin -d postgres -v old=$OLD_URL -v new=$NEXT_PUBLIC_SITE_URL" < ../deploy/supabase/rewrite-urls.sql
          echo "Перенесено:"
          ssh prod 'cd /opt/opora && ./dc.sh exec -T db psql -U postgres -c "select (select count(*) from auth.users) as users, (select count(*) from public.profiles) as profiles, (select count(*) from public.messages) as messages"'
