<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Подтвердите новую почту</title>
</head>
<body style="margin:0;padding:0;background:#f4efe7;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Подтвердите смену адреса почты.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4efe7;">
  <tr>
    <td align="center" style="padding:48px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <div style="width:56px;height:56px;border-radius:50%;background:#c9d8e6;background-image:radial-gradient(circle at 35% 30%,#fffdf9 0%,#e7e1f2 35%,#bccfe0 70%,#b4cbaa 100%);margin:0 auto 14px auto;"></div>
            <div style="font-family:Georgia,'Times New Roman',serif;font-size:22px;color:#34373c;letter-spacing:0.2px;">Опора</div>
          </td>
        </tr>
        <tr>
          <td style="background:#fffdf9;border:1px solid #ebe4d8;border-radius:28px;padding:40px 36px;">
            <h1 style="margin:0 0 16px 0;font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:26px;line-height:1.3;color:#34373c;text-align:center;">Новая почта</h1>
            <p style="margin:0 0 30px 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#6c6f75;text-align:center;">Подтвердите, пожалуйста, что хотите использовать этот адрес для входа в Опору.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
              <tr>
                <td align="center" style="border-radius:999px;background:#34373c;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 34px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#fffdf9;text-decoration:none;border-radius:999px;">Подтвердить</a>
                </td>
              </tr>
            </table>
            <p style="margin:30px 0 0 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#a3a4a8;text-align:center;">Если вы ничего не меняли, просто проигнорируйте это письмо.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 24px 0 24px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#a3a4a8;">
            Опора — спокойное место, чтобы выговориться и разобраться в себе.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
